annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Compute price elasticity of demand coefficient for target product SKU.
input_schema:
  additionalProperties: false
  properties:
    price_history:
      type: string
    unit_sales_history:
      type: string
  required:
  - price_history
  - unit_sales_history
  type: object
name: calculate-price-elasticity
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
