name: Retail Pricing & Inventory CI

on: [push, pull_request]

jobs:
  retail-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Product Catalog
        run: |
          python -c "import json; d=json.load(open('fixtures/catalog/sample_sku_catalog.json')); assert len(d)>=2; print('Catalog validated')"
      - name: Run Retail Unit Tests
        run: pytest tests/ -v
      - name: Validate OpenGAP 0.1.0 Manifest
        run: |
          python -c "import yaml; d=yaml.safe_load(open('agent.yaml')); assert d['spec_version']=='0.1.0' and len(d)==5; print('OpenGAP Spec Validated')"
